name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/looneman1/voxhold-frontend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  container:
    name: Build Docker image
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  browser-smoke:
    name: WebRTC browser smoke
    if: >-
      vars.VOXHOLD_E2E_BASE_URL != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: test
    runs-on: ubuntu-latest

    env:
      VOXHOLD_E2E_BASE_URL: ${{ vars.VOXHOLD_E2E_BASE_URL }}
      VOXHOLD_E2E_VOICE_CHANNEL: ${{ vars.VOXHOLD_E2E_VOICE_CHANNEL }}
      VOXHOLD_E2E_PUBLISHER_USERNAME: ${{ secrets.VOXHOLD_E2E_PUBLISHER_USERNAME }}
      VOXHOLD_E2E_PUBLISHER_PASSWORD: ${{ secrets.VOXHOLD_E2E_PUBLISHER_PASSWORD }}
      VOXHOLD_E2E_VIEWER_USERNAME: ${{ secrets.VOXHOLD_E2E_VIEWER_USERNAME }}
      VOXHOLD_E2E_VIEWER_PASSWORD: ${{ secrets.VOXHOLD_E2E_VIEWER_PASSWORD }}
      VOXHOLD_E2E_RUN_TURN: ${{ vars.VOXHOLD_E2E_RUN_TURN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test server stream and ICE recovery
        run: npm run test:e2e:stream

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-browser-smoke-${{ github.run_id }}
          path: node_modules/.cache/playwright-results
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish Docker image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; nothing to do."
            exit 0
          fi

          release_args=()
          if [[ "$TAG_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Voxhold Frontend $TAG_NAME" \
            --generate-notes \
            "${release_args[@]}"
