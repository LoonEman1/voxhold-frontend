name: Frontend CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/looneman1/voxhold-frontend

jobs:
  release-plan:
    name: Release plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      minor: ${{ steps.plan.outputs.minor }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test release planning
        run: python3 .github/scripts/test-release-plan.py
      - name: Validate version and release eligibility
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release-plan.py

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  client-performance:
    name: Client browser regressions
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Keep this version in sync with Playwright in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test media, chat and recording regressions
        run: npm run test:e2e:performance
      - name: Test themes, recording UI and avatar crop
        run: npm run test:e2e:ui

  container:
    name: Build Docker image
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  browser-smoke:
    name: WebRTC browser smoke
    if: >-
      vars.VOXHOLD_E2E_BASE_URL != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: test
    runs-on: ubuntu-latest

    env:
      VOXHOLD_E2E_BASE_URL: ${{ vars.VOXHOLD_E2E_BASE_URL }}
      VOXHOLD_E2E_VOICE_CHANNEL: ${{ vars.VOXHOLD_E2E_VOICE_CHANNEL }}
      VOXHOLD_E2E_PUBLISHER_USERNAME: ${{ secrets.VOXHOLD_E2E_PUBLISHER_USERNAME }}
      VOXHOLD_E2E_PUBLISHER_PASSWORD: ${{ secrets.VOXHOLD_E2E_PUBLISHER_PASSWORD }}
      VOXHOLD_E2E_VIEWER_USERNAME: ${{ secrets.VOXHOLD_E2E_VIEWER_USERNAME }}
      VOXHOLD_E2E_VIEWER_PASSWORD: ${{ secrets.VOXHOLD_E2E_VIEWER_PASSWORD }}
      VOXHOLD_E2E_RUN_TURN: ${{ vars.VOXHOLD_E2E_RUN_TURN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test server stream and ICE recovery
        run: npm run test:e2e:stream

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-browser-smoke-${{ github.run_id }}
          path: node_modules/.cache/playwright-results
          if-no-files-found: ignore
          retention-days: 7

  upload-proxy:
    name: Upload proxy regression
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify production upload size boundaries
        run: node scripts/test-upload-proxy.mjs

  publish:
    name: Publish Docker image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.release-plan.outputs.release == 'true'
    needs: [release-plan, test, client-performance, upload-proxy]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.release-plan.outputs.version }},priority=900
            type=raw,value=${{ needs.release-plan.outputs.minor }},priority=800
            type=raw,value=latest,priority=700

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release:
    name: Create GitHub release
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.release-plan.outputs.release == 'true'
    needs: [release-plan, publish]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Publish immutable tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-plan.outputs.tag }}
          RELEASE_TITLE: Voxhold Frontend ${{ needs.release-plan.outputs.tag }}
        run: bash .github/scripts/publish-release.sh
