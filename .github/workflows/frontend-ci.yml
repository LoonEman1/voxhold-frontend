name: Frontend CI

on:
  pull_request:
    branches: [main, dev]
  push:
    # dev does not require PR branches to be up to date, so its pushes run the
    # tests to catch PRs that pass alone but break together. They never build
    # or publish images.
    branches: [main, dev]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  # Superseded PR and dev runs are cancelled: only the latest state matters.
  # A main or tag run may be publishing images and a release, so it always
  # runs to completion.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE_NAME: ghcr.io/looneman1/voxhold-frontend

jobs:
  release-plan:
    name: Release plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      minor: ${{ steps.plan.outputs.minor }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test release planning
        run: python3 .github/scripts/test-release-plan.py
      - name: Validate version and release eligibility
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release-plan.py

  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Classify changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        # Documentation-only PRs skip tests, browser runs and image builds.
        # Skipped required jobs report success, so these PRs still merge.
        # Any doubt runs everything.
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)" || [ -z "$files" ]; then
            echo '::warning::Cannot list changed files; running every check.'
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files"
          if printf '%s\n' "$files" | grep -Evq '(\.md$|^docs/|^LICENSE$)'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo 'Documentation-only change: tests, browser runs and image builds are skipped.'
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test
    needs: changes
    # Runs unless the change is documentation-only; a failed classification
    # leaves the output empty and therefore runs the checks.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Formerly a separate job; it needs only Node and Docker from this runner.
      - name: Verify production upload size boundaries
        timeout-minutes: 5
        run: node scripts/test-upload-proxy.mjs

  # Independent of the unit tests: runs in parallel to shorten PR feedback.
  client-performance:
    name: Client browser regressions
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Keep this version in sync with Playwright in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test media, chat and recording regressions
        run: npm run test:e2e:performance
      - name: Test themes, recording UI and avatar crop
        run: npm run test:e2e:ui

  container:
    name: Build Docker image
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Both release platforms: the build stage runs natively and the ARM64
      # runtime stage only copies files, so no emulation is needed.
      - name: Validate release platforms
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  browser-smoke:
    name: WebRTC browser smoke
    needs: changes
    if: >-
      !cancelled() &&
      needs.changes.outputs.code != 'false' &&
      vars.VOXHOLD_E2E_BASE_URL != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    container:
      # Browsers are preinstalled; keep in sync with client-performance.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host

    env:
      VOXHOLD_E2E_BASE_URL: ${{ vars.VOXHOLD_E2E_BASE_URL }}
      VOXHOLD_E2E_VOICE_CHANNEL: ${{ vars.VOXHOLD_E2E_VOICE_CHANNEL }}
      VOXHOLD_E2E_PUBLISHER_USERNAME: ${{ secrets.VOXHOLD_E2E_PUBLISHER_USERNAME }}
      VOXHOLD_E2E_PUBLISHER_PASSWORD: ${{ secrets.VOXHOLD_E2E_PUBLISHER_PASSWORD }}
      VOXHOLD_E2E_VIEWER_USERNAME: ${{ secrets.VOXHOLD_E2E_VIEWER_USERNAME }}
      VOXHOLD_E2E_VIEWER_PASSWORD: ${{ secrets.VOXHOLD_E2E_VIEWER_PASSWORD }}
      VOXHOLD_E2E_RUN_TURN: ${{ vars.VOXHOLD_E2E_RUN_TURN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test server stream and ICE recovery
        run: npm run test:e2e:stream

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-browser-smoke-${{ github.run_id }}
          path: node_modules/.cache/playwright-results
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish Docker image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.release-plan.outputs.release == 'true'
    needs: [release-plan, test, client-performance]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.release-plan.outputs.version }},priority=900
            type=raw,value=${{ needs.release-plan.outputs.minor }},priority=800
            type=raw,value=latest,priority=700

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The static bundle is built once natively; each platform only gets its
      # own nginx runtime layer, so QEMU is no longer needed.
      - name: Build and publish release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release:
    name: Create GitHub release
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.release-plan.outputs.release == 'true'
    needs: [release-plan, publish]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Publish immutable tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-plan.outputs.tag }}
          RELEASE_TITLE: Voxhold Frontend ${{ needs.release-plan.outputs.tag }}
        run: bash .github/scripts/publish-release.sh
